name: Extract Views Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Views ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p /tmp/views_extract
          unzip -o "$ZIP_FILE" -d /tmp/views_extract

          PROJECT_DIR=$(find /tmp/views_extract -type f -name "package.json" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside the ZIP."
            find /tmp/views_extract -maxdepth 3 -type f
            exit 1
          fi

          echo "Views project found at: $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          rm -f "$ZIP_FILE"

      - name: Commit Views project
        shell: bash
        run: |
          git config user.name "Views Builder"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract Views application"
            git push
          fi
