name: Extract Views Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find Views ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Views
        env:
          ZIP_FILE: ${{ steps.find_zip.outputs.zip_file }}
        run: |
          python - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1])

          print("Opening:", zip_path)

          if not zipfile.is_zipfile(zip_path):
              raise SystemExit("ERROR: File is not a valid ZIP archive.")

          with zipfile.ZipFile(zip_path, "r") as z:
              print("Files in archive:", len(z.namelist()))
              z.extractall("/tmp/views_project")

          print("Extraction completed successfully.")
          PY

      - name: Locate package.json
        id: locate
        run: |
          PROJECT_DIR=$(find /tmp/views_project -name package.json -type f -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found."
            find /tmp/views_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Copy Views project
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          cp -R "$PROJECT_DIR"/. .

      - name: Remove ZIP files
        run: |
          find . -type f -iname "*.zip" -delete

      - name: Commit Views project
        run: |
          git config user.name "Views Builder"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Install Views application source"
            git push
          fi
