name: Extract Views Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Views ZIP
        run: |
          mkdir -p extracted
          unzip -o views_complete_demo_v2.zip -d extracted
          
          if [ -d "extracted/views_complete_demo_v2" ]; then
            cp -R extracted/views_complete_demo_v2/. .
          else
            cp -R extracted/. .
          fi
          
          rm -rf extracted
          rm -f views_complete_demo_v2.zip

      - name: Commit project files
        run: |
          git config user.name "Views Builder"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Views application"
          git push
